<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ห้องทดลองฟิสิกส์ TPAT3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header id="hdr">
    <p class="site-title">ห้องทดลองฟิสิกส์ TPAT3</p>
    <h1 id="siteH1">ห้องทดลองฟิสิกส์ TPAT3</h1>
    <p id="subjDesc"></p>
  </header>
  <nav class="subjects" role="tablist" id="subjects" aria-label="บท"></nav>
  <div id="landing" hidden></div>
  <main class="home" id="homeGrid" hidden></main>
  <div id="lab" hidden>
    <div class="tabs" role="tablist" id="tabs" aria-label="แบบจำลอง"></div>
    <section class="card case-head" id="head" style="margin-top:12px"></section>
    <div class="layout" style="margin-top:14px">
      <div class="col-main">
        <div class="viewer" id="viewer">
          <div class="vbar" id="vbar" hidden></div>
          <div class="vbox" id="vbox">
            <svg id="svg" viewBox="0 0 640 300" role="img" aria-label="ภาพจำลอง"></svg>
            <canvas id="cv" hidden aria-label="แอนิเมชันจำลอง"></canvas>
            <div id="v3host" hidden></div>
          </div>
          <div class="live" id="live"></div>
        </div>
        <section class="card" id="graphCard" hidden><div class="glegend" id="glegend"></div><canvas id="gcv"></canvas></section>
      </div>
      <aside class="col-side"><div class="card controls" id="controls"></div></aside>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;margin-top:14px">
      <section class="card" id="outCard"><h3>ผลที่คำนวณได้</h3><div class="out" id="out"></div><div id="warn"></div></section>
      <section class="card" id="extraCard" hidden><h3 id="extraTitle"></h3><div class="tw" id="extra"></div></section>
      <section class="card" id="sensCard"><h3>ตารางทิศทาง</h3><p class="hint" id="sensHint"></p><div class="tw"><table id="sens"></table></div></section>
      <section class="card"><h3>ข้อสังเกต</h3><ul class="notes" id="notes"></ul></section>
    </div>
  </div>
  <footer id="foot"></footer>
  <div class="credit-row"><div class="btns"><button class="btn" id="themebtn">สลับโหมดมืด/สว่าง</button></div><p class="credit">สร้างโดย <a href="https://www.instagram.com/base_happy19/" target="_blank" rel="noopener">IG: base_happy19</a></p></div>
</div>
<script src="vendor/three.min.js"></script>
<script src="js/engine.js"></script>
<script src="js/draw2d.js"></script>
<script src="js/graph.js"></script>
<script src="js/view3d.js"></script>
<script src="js/kit.js"></script>
<script src="js/chapters.js"></script>
<!-- แบบจำลองแต่ละบท: เพิ่มไฟล์ใหม่ต่อท้ายตรงนี้ -->
<script src="js/subjects/sci.js"></script>
<script src="js/subjects/kin.js"></script>
<script src="js/subjects/newton.js"></script>
<script src="js/subjects/equil.js"></script>
<script src="js/subjects/energy.js"></script>
<script src="js/subjects/momentum.js"></script>
<script src="js/subjects/proj.js"></script>
<script src="js/subjects/circ.js"></script>
<script src="js/subjects/shm.js"></script>
<script src="js/subjects/elec.js"></script>
<script src="js/subjects/thermo.js"></script>
<script src="js/subjects/solid.js"></script>
<script src="js/subjects/fluid2.js"></script>
<script src="js/subjects/fluid.js"></script>
<script src="js/subjects/waves.js"></script>
<script src="js/subjects/optics.js"></script>
<script src="js/subjects/modern.js"></script>
<script src="js/subjects/relativity.js"></script>
<script src="js/subjects/env.js"></script>
<script>Lab.start();</script>
</body>
</html>
